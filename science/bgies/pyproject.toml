[project]
name = "bgies"
version = "1.0.0"
description = "Bacteria-DNA Wechselwirkung: Formale Modellierung und Implementierung"
authors = [
    {name = "Stephan Epp", email = "naphets29@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=2.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "networkx>=3.7",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--cov=src",
    "--cov-report=html:doc/coverage",
    "--cov-report=term-missing",
]
markers = [
    "performance: Markiert Tests für Performance- und Benchmark-Messungen",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "venv/*",
    "doc/*",
    "src/experiments.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
