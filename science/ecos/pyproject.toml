[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-analysis"
version = "1.0.0"
description = "Economic Analysis Module - Formal Theory and System Analysis Based on Dissertation Work"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Stephan Epp", email = "naphets29@google.com"}
]
keywords = ["economics", "resonance", "system-analysis", "uncertainty", "market-dynamics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Economics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "black>=23.0",
    "flake8>=5.0",
    "mypy>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ecos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=ecos",
    "--cov-report=html:doc/coverage",
    "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
source = ["ecos"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/01_simple_resonance_sweep.py",
    "*/02_local_economy_panel.py",
    "*/03_global_economy_network.py",
    "*/04_monte_carlo_robustness.py",
    "*/05_ship_freight_experiment.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
skip_covered = false

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
