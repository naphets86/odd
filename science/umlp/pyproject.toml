[project]
name = "uml"
version = "2.1.0"
description = "UML-Profil-basierte Code-Generierung mit Zeit-Annotationen für Echtzeitsysteme"
authors = [
    {name = "Stephan Epp"}
]
requires-python = ">=3.11"
dependencies = [
    "scipy>=1.18.1",
    "numpy>=2.5.3",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "cairosvg>=2.9.1",
]

[project.optional-dependencies]
dev = [
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--cov=src",
    "--cov-report=html:doc/coverage",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "venv/*",
    "doc/*",
    "src/main.py",
    "src/template_generator.py",
    "src/experiments.py",
    "src/demo_analyzer.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]