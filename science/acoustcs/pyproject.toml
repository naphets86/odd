[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustics-hearing"
version = "1.0.0"
description = "Biological Acoustics and Cochlear A/D Conversion: Feline Hearing and Room Acoustics"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Stephan Epp", email = "naphets29@google.com"}
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "black>=23.0",
    "flake8>=5.0",
    "mypy>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["acoustcs"]

[tool.setuptools.package-data]
acoustcs = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=acoustcs",
    "--cov-report=html:doc/coverage",
    "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
source = ["acoustcs"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/experiments.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
skip_covered = false

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
